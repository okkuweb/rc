default_mode: urw_vi

modmap:
  - name: Slim X1 Keyboard Alt/Super Swap
    device:
      only: [
        'Slim X1 Keyboard',
        'SONiX Satechi Compact Keyboard'
      ]
    remap:
      Alt_L: Super_L
      Super_L: Alt_L
  - name: Keyboard mouse bindings
    remap:
      CapsLock: BTN_LEFT

keymap:
  - name: UnReal World vi movement
    application:
      only: '/[Uu][Rr][Ww]|[Uu]n[Rr]eal.?[Ww]orld/'
    exact_match: true
    mode: urw_vi
    remap:
      # Put Enter within easy reach for map and menu actions.
      Tab: Enter

      # Preserve the original letter commands behind Ctrl.
      Ctrl-Y: Y
      Ctrl-U: U
      Ctrl-H: H
      Ctrl-J: J
      Ctrl-K: K
      Ctrl-L: L
      Ctrl-B: B
      Ctrl-N: N

      # Move without turning using UnReal World's Ctrl+numpad controls.
      Super-Y: Ctrl-KEY_KP7
      Super-K: Ctrl-KEY_KP8
      Super-U: Ctrl-KEY_KP9
      Super-H: Ctrl-KEY_KP4
      Super-L: Ctrl-KEY_KP6
      Super-B: Ctrl-KEY_KP1
      Super-J: Ctrl-KEY_KP2
      Super-N: Ctrl-KEY_KP3

      # Vi-style movement using UnReal World's numpad controls.
      Y: KEY_KP7
      K: KEY_KP8
      U: KEY_KP9
      H: KEY_KP4
      L: KEY_KP6
      B: KEY_KP1
      J: KEY_KP2
      N: KEY_KP3
      BACKSLASH: { set_mode: urw_original }
  - name: UnReal World original bindings
    application:
      only: '/[Uu][Rr][Ww]|[Uu]n[Rr]eal.?[Ww]orld/'
    exact_match: true
    mode: urw_original
    remap:
      Tab: Enter
      BACKSLASH: { set_mode: urw_vi }
  - name: Mouse bindings
    remap:
      Alt-F1: CapsLock
  - name: Alt WASD arrows
    remap:
      Alt_L-w: up
      Alt_L-a: left
      Alt_L-s: down
      Alt_L-d: right
