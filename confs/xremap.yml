default_mode: urw_vi
keypress_delay_ms: 20

modmap:
  - name: Slim X1 Keyboard Alt/Super Swap
    device:
      only: [
        'Slim X1 Keyboard',
        'SONiX Satechi Compact Keyboard'
      ]
    remap:
      Alt_L: Super_L
      Super_L: Alt_L
  - name: Keyboard mouse bindings
    remap:
      CapsLock: BTN_LEFT

keymap:
  - name: UnReal World vi movement
    application:
      only: '/[Uu][Rr][Ww]|[Uu]n[Rr]eal.?[Ww]orld/'
    exact_match: true
    mode: urw_vi
    remap:
      # Put Enter within easy reach for map and menu actions.
      Tab: Enter

      # Preserve the original letter commands behind Ctrl.
      Super-Y: Y
      Super-U: U
      Super-H: H
      Super-J: J
      Super-K: K
      Super-L: L
      Super-B: B
      Super-N: N

      # Move without turning using UnReal World's Ctrl+numpad controls.
      Shift-Y: Ctrl-KEY_KP7
      Shift-K: Ctrl-KEY_KP8
      Shift-U: Ctrl-KEY_KP9
      Shift-H: Ctrl-KEY_KP4
      Shift-L: Ctrl-KEY_KP6
      Shift-B: Ctrl-KEY_KP1
      Shift-J: Ctrl-KEY_KP2
      Shift-N: Ctrl-KEY_KP3

      # Vi-style movement using UnReal World's numpad controls.
      Y: KEY_KP7
      K: KEY_KP8
      U: KEY_KP9
      H: KEY_KP4
      L: KEY_KP6
      B: KEY_KP1
      J: KEY_KP2
      N: KEY_KP3
      APOSTROPHE: { set_mode: urw_original }
  - name: UnReal World original bindings
    application:
      only: '/[Uu][Rr][Ww]|[Uu]n[Rr]eal.?[Ww]orld/'
    exact_match: true
    mode: urw_original
    remap:
      Tab: Enter
      APOSTROPHE: { set_mode: urw_vi }
  - name: Mouse bindings
    remap:
      Alt-F1: CapsLock
  - name: Alt WASD arrows
    application:
      not: '/[Uu][Rr][Ww]|[Uu]n[Rr]eal.?[Ww]orld/'
    exact_match: true
    remap:
      Alt_L-w: up
      Alt_L-a: left
      Alt_L-s: down
      Alt_L-d: right
