# ~/.config/keymapper/keymapper.conf

# False initially, corresponding to xremap's default_mode: urw_vi.
UrwOriginal = Virtual


# ---------------------------------------------------------------------------
# Stage 1: equivalent to xremap modmap
# ---------------------------------------------------------------------------

[device = "Slim X1 Keyboard"]
[device = "SONiX Satechi Compact Keyboard"]

AltLeft  >> MetaLeft
MetaLeft >> AltLeft


[default]

# Keyboard mouse binding.
CapsLock >> ButtonLeft


# Feed modmap output into the remaining mappings, like xremap does.
[stage]


# ---------------------------------------------------------------------------
# UnReal World bindings shared by both modes
# ---------------------------------------------------------------------------

[class = /urw|unreal.?world/i]

# exact_match: true
!Shift !Control !Alt !Meta Tab       >> Enter
!Shift !Control !Alt !Meta Semicolon >> UrwOriginal^


# ---------------------------------------------------------------------------
# UnReal World vi mode
#
# UrwOriginal is initially released, so this is the default mode.
# ---------------------------------------------------------------------------

[class = /urw|unreal.?world/i modifier = "!UrwOriginal"]

# Preserve original commands behind Super.
!Shift !Control !Alt Meta{Y} >> Y
!Shift !Control !Alt Meta{U} >> U
!Shift !Control !Alt Meta{H} >> H
!Shift !Control !Alt Meta{J} >> J
!Shift !Control !Alt Meta{K} >> K
!Shift !Control !Alt Meta{L} >> L
!Shift !Control !Alt Meta{B} >> B
!Shift !Control !Alt Meta{N} >> N

# Move without turning. These remain held and repeat normally.
!Control !Alt !Meta Shift{Y} >> Control{Numpad7}
!Control !Alt !Meta Shift{K} >> Control{Numpad8}
!Control !Alt !Meta Shift{U} >> Control{Numpad9}
!Control !Alt !Meta Shift{H} >> Control{Numpad4}
!Control !Alt !Meta Shift{L} >> Control{Numpad6}
!Control !Alt !Meta Shift{B} >> Control{Numpad1}
!Control !Alt !Meta Shift{J} >> Control{Numpad2}
!Control !Alt !Meta Shift{N} >> Control{Numpad3}

# Vi-style movement.
!Shift !Control !Alt !Meta Y >> Numpad7
!Shift !Control !Alt !Meta K >> Numpad8
!Shift !Control !Alt !Meta U >> Numpad9
!Shift !Control !Alt !Meta H >> Numpad4
!Shift !Control !Alt !Meta L >> Numpad6
!Shift !Control !Alt !Meta B >> Numpad1
!Shift !Control !Alt !Meta J >> Numpad2
!Shift !Control !Alt !Meta N >> Numpad3


# ---------------------------------------------------------------------------
# Global mouse binding
# ---------------------------------------------------------------------------

[default]

Alt{F1} >> CapsLock


# ---------------------------------------------------------------------------
# Alt+WASD outside UnReal World
# ---------------------------------------------------------------------------

[class != /urw|unreal.?world/i]

# Exact left-Alt combinations.
!Shift !Control !Meta !AltRight AltLeft{W} >> ArrowUp
!Shift !Control !Meta !AltRight AltLeft{A} >> ArrowLeft
!Shift !Control !Meta !AltRight AltLeft{S} >> ArrowDown
!Shift !Control !Meta !AltRight AltLeft{D} >> ArrowRight
